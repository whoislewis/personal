<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Kim Lewis — Graphic Designer</title>
    <meta name="description" content="Kim Lewis, graphic designer. Communication design, typography, identity." />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
  </head>
  <body>
    <div id="app">
      <div id="canvas" class="canvas">
        <div id="field" class="field" aria-hidden="true"></div>
      </div>

      <div id="cursor" class="cursor" aria-hidden="true">
        <div id="caret" class="caret"></div>
        <div id="cursor-text" class="cursor-text"></div>
      </div>

      <nav id="arrangement-nav" class="arrangement-nav" aria-label="Switch arrangement" hidden>
        <button type="button" data-arrangement="cloud" class="arrangement-btn" aria-pressed="true">
          <span class="visually-hidden">Cloud arrangement</span>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="7" cy="9" r="2.4"/><circle cx="13" cy="6" r="1.8"/><circle cx="17" cy="12" r="2.2"/><circle cx="9" cy="15" r="1.6"/></svg>
        </button>
        <button type="button" data-arrangement="grid" class="arrangement-btn" aria-pressed="false">
          <span class="visually-hidden">Grid arrangement</span>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg>
        </button>
        <button type="button" data-arrangement="stack" class="arrangement-btn" aria-pressed="false">
          <span class="visually-hidden">Stack arrangement</span>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="4" y="4" width="14" height="14"/><rect x="6" y="6" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
      </nav>

      <div id="live-region" class="visually-hidden" aria-live="polite"></div>

      <div id="lightbox-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
